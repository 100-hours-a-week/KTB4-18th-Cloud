# 외부 요청을 활성 FE·BE 슬롯으로 전달하는 Compose Nginx 설정입니다.
# WebSocket 요청에 필요한 Connection 헤더 값을 결정합니다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    # 외부 요청은 이 Nginx 하나로 받고 FE 또는 BE 활성 슬롯으로 전달합니다.
    listen 80 default_server;
    server_name _;
    location = /health { access_log off; return 200 "ok"; }
    location = /actuator/health {
        proxy_pass http://backend_active;
        proxy_set_header Host $host;
    }
    # /api 경로는 Backend로 전달하며 원래 경로를 유지합니다.
    location /api/ {
        proxy_pass http://backend_active;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # 나머지 요청은 SPA를 제공하는 Frontend로 전달합니다.
    location / { proxy_pass http://frontend_active; }
}
