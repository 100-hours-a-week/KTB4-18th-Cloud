apiVersion: v1
data:
  default.conf: |2

    server {
        listen 80;
        server_name v3.meomuneum.com;
        root /usr/share/nginx/html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 180s;
        client_max_body_size 11m;
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        set $core core.v3-app.svc.cluster.local:8080;
        set $chat chat.v3-app.svc.cluster.local:8080;
        location = /healthz { return 200 'ok'; }
        location = /ws {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_pass http://$chat;
        }
        location ~ ^/api/v1/(chat-rooms(/|$)|regions/[^/]+/chat-room$) { proxy_pass http://$chat; }
        location /api/ { proxy_pass http://$core; }
        location / { try_files $uri $uri/ /index.html; }
    }
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: v3-app
