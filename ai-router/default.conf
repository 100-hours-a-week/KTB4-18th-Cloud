# 초기 템플릿. 실제 active slot은 deploy.sh가 관리합니다.
upstream ai_active { server ai-blue:8001; }
server {
    listen 8001;
    location / {
        proxy_pass http://ai_active;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
