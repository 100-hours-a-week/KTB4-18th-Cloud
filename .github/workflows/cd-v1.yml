name: MME V1 CD

# CI에서 호출하거나 GitHub 화면에서 검증된 이미지 URI를 직접 입력해 실행합니다.
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy (frontend, backend, or ai)
        required: true
        type: choice
        options: [frontend, backend, ai]
      image:
        description: Verified ECR URI with full commit SHA or digest
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  # 같은 EC2에 두 배포가 동시에 실행되지 않도록 직렬화합니다.
  group: mme-v1-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      # 장기 AWS Key 대신 GitHub OIDC로 배포 Role을 임시 수임합니다.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MME_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Validate deployment inputs and prepare SSM command
        env:
          INSTANCE_ID: ${{ vars.MME_EC2_INSTANCE_ID }}
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
        run: python3 deploy/scripts/ssm-command.py > /tmp/deploy-command.json
      - name: Deploy through SSM
        env:
          AWS_PAGER: ''
        run: |
          set -euo pipefail
          # SSH를 열지 않고 SSM Run Command로 EC2 배포 스크립트를 실행합니다.
          command_id=$(aws ssm send-command --cli-input-json file:///tmp/deploy-command.json --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          python3 deploy/scripts/wait-ssm.py "$command_id" '${{ vars.MME_EC2_INSTANCE_ID }}'
