name: MME V1.1 CI

on:
  # 서비스별 CI를 적용하기 전에 Cloud에서 수동으로 빌드 절차를 검증한다.
  workflow_dispatch:
    inputs:
      service:
        description: Service to validate and publish
        type: choice
        options: [frontend, backend, ai]
        required: true

      source_ref:
        description: Source commit SHA or branch
        default: main
        required: true

      ai_app_module:
        description: Actual AI ASGI module (upstream must implement it first)
        default: backend.main:app
        required: true

permissions:
  contents: read

jobs:
  # Compose와 배포 스크립트 자체를 먼저 검증한다.
  config:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - run: |
          bash -n deploy/scripts/deploy-v1.1.sh
          bash -n deploy/postgres/init/01-vector.sh

      - run: python3 -m unittest discover -s tests -v

      - name: Validate Compose model
        run: |
          mkdir -p .runtime
          touch \
            .runtime/backend-{blue,green}.env \
            .runtime/ai.env \
            .runtime/mysql.env \
            .runtime/postgres.env

          docker compose \
            --env-file .deploy.env.example \
            --profile blue \
            --profile green \
            config \
            --quiet

      - name: Validate shell
        run: |
          shellcheck \
            deploy/scripts/deploy-v1.1.sh \
            deploy/postgres/init/01-vector.sh

  # 애플리케이션을 테스트하고 배포 가능한 이미지를 ECR에 발행한다.
  build:
    # 운영 AWS 권한을 사용하는 검증은 main에서 수동 실행할 때만 허용한다.
    if: github.ref == 'refs/heads/main'

    needs: config

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      # 한 서비스가 실패해도 나머지 결과까지 확인한다.
      fail-fast: false

      matrix:
        service: ${{ fromJSON(
          github.event_name == 'workflow_dispatch'
          && format('["{0}"]', inputs.service)
          || '["frontend","backend","ai"]'
          ) }}

    permissions:
      contents: read

      id-token: write

    # Backend 테스트용이다. Matrix job이라 FE와 AI 실행에도 생성된다.
    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: meomuneum_test
          MYSQL_USER: meomuneum_test
          MYSQL_PASSWORD: ci-test-password

        ports:
          - "3306:3306"

        options: >-
          --health-cmd="MYSQL_PWD=ci-test-password mysql -h 127.0.0.1 -u meomuneum_test meomuneum_test -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:

      - uses: actions/checkout@v4

      # 선택된 서비스의 실제 소스를 별도 디렉터리에 받는다.
      - uses: actions/checkout@v4
        with:
          repository: ${{
            matrix.service == 'frontend'
            && '100-hours-a-week/KTB4-18th-FE'
            || matrix.service == 'backend'
            && '100-hours-a-week/KTB4-18th-BE'
            || '100-hours-a-week/KTB4-18th-AI'
            }}

          ref: ${{
            github.event_name == 'workflow_dispatch'
            && inputs.source_ref
            || 'main'
            }}

          path: source

          persist-credentials: false

      # 소스와 배포 설정을 함께 추적할 수 있도록 두 SHA를 태그에 넣는다.
      - name: Resolve commit and image
        id: image

        env:
          SERVICE: ${{ matrix.service }}

          FE_URI: ${{ vars.MME_FRONTEND_ECR_URI }}
          BE_URI: ${{ vars.MME_BACKEND_ECR_URI }}
          AI_URI: ${{ vars.MME_AI_ECR_URI }}

        run: |
          source_sha=$(git -C source rev-parse HEAD)

          cloud_sha=${GITHUB_SHA:0:12}

          case "$SERVICE" in
            frontend)
              uri="$FE_URI"
              ;;
            backend)
              uri="$BE_URI"
              ;;
            ai)
              uri="$AI_URI"
              ;;
          esac

          test -n "$uri"

          image="$uri:$source_sha-$cloud_sha"

          echo "tag=$image" >> "$GITHUB_OUTPUT"

          echo "$image" > "$SERVICE-image.txt"

      # Frontend
      - uses: actions/setup-node@v4
        if: matrix.service == 'frontend'

        with:
          node-version: '24'

          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Frontend lint and build
        if: matrix.service == 'frontend'
        working-directory: source

        run: |
          npm ci

          npm run lint

          npm run build

      # Backend
      - uses: actions/setup-java@v4
        if: matrix.service == 'backend'

        with:
          distribution: temurin
          java-version: '25'

      - name: Backend tests
        if: matrix.service == 'backend'
        working-directory: source

        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/meomuneum_test
          TEST_DB_USERNAME: meomuneum_test
          TEST_DB_PASSWORD: ci-test-password

        run: |
          chmod +x gradlew

          ./gradlew test --no-daemon

      # AI
      - name: Set up Python
        if: matrix.service == 'ai'
        uses: actions/setup-python@v5

        with:
          python-version: '3.12.13'

      - uses: astral-sh/setup-uv@v6
        if: matrix.service == 'ai'

        with:
          version: '0.8.22'

      - name: AI dependencies, entrypoint and tests
        if: matrix.service == 'ai'
        working-directory: source

        env:
          AI_APP_MODULE: ${{
            github.event_name == 'workflow_dispatch'
            && inputs.ai_app_module
            || 'backend.main:app'
            }}

        run: |
          uv sync --frozen

          uv run python -c \
            "import importlib,os; \
            m,a=os.environ['AI_APP_MODULE'].split(':'); \
            assert callable(getattr(importlib.import_module(m),a))"

          if find . \
            -path './.venv' -prune \
            -o -name 'test_*.py' -print \
            | grep -q .; then

            uv run pytest
          else
            echo '::warning::Upstream AI repository has no pytest tests.'
          fi

      # Image build and scan
      - uses: docker/setup-buildx-action@v3

      - name: Build image before requesting AWS credentials
        uses: docker/build-push-action@v6

        with:
          context: source

          file: docker/${{ matrix.service }}.Dockerfile

          load: true

          tags: ${{ steps.image.outputs.tag }}

          build-args: >-
            AI_APP_MODULE=${{
            github.event_name == 'workflow_dispatch'
            && inputs.ai_app_module
            || 'backend.main:app'
            }}

          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: ${{ steps.image.outputs.tag }}

          format: table

          exit-code: '1'

          ignore-unfixed: true

          severity: CRITICAL,HIGH

          trivyignores: '.trivyignore'

      # 검증을 모두 통과한 뒤에만 AWS 권한을 요청한다.
      - uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.MME_AWS_BUILD_ROLE_ARN }}

          aws-region: ap-northeast-2

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Push verified image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}

        run: |
          docker push "$IMAGE"

      - uses: actions/upload-artifact@v4

        with:
          name: ${{ matrix.service }}-image

          path: ${{ matrix.service }}-image.txt
